<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>移动访问</title>
  <link rel="stylesheet" href="/shell/lan.css">
</head>
<body>
  <main data-state="loading">
    <h1>移动访问</h1>
    <p class="intro">用手机微信扫描下面的二维码并确认，之后直接在微信里和这台电脑上的助手对话。不需要同一 Wi-Fi，也不需要配对码。</p>

    <div id="frame-box" class="frame-box" hidden>
      <iframe id="frame" src="/wechat/qr" title="微信扫码登录"></iframe>
    </div>

    <p id="missing" class="notice" hidden>
      微信通道没有加载：请到「设置 → 插件管理」安装 <code>dsh-wechat</code>，装好后重启应用再打开这里。
    </p>

    <section id="controls" class="controls" hidden>
      <div class="row">
        <label>工作目录<input id="cwd" placeholder="留空表示不修改" autocomplete="off"></label>
        <label>卡片超时（毫秒）<input id="timeout" placeholder="留空表示不修改" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="row actions">
        <button id="save" type="button">保存配置</button>
        <button id="relogin" type="button">重新扫码</button>
        <button id="logout" type="button" class="danger">退出登录</button>
        <span id="message" class="message" role="status"></span>
      </div>
      <p class="hint">完整的渠道设置（提示词、跨会话推送、静默等）在「设置 → WeChat」里；这里只放常用的三项。</p>
    </section>
  </main>
  <script src="/shell/lan.js"></script>
</body>
</html>
